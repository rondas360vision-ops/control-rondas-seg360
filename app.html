<h2 id="titulo">Marcar ronda</h2>
<p class="sub" id="subtitulo">Cargando punto...</p>

<input id="codigo" placeholder="Código de guardia">
<input id="foto" type="file" accept="image/*" capture="environment">
<button type="button" onclick="quitarFoto()" style="background:transparent;color:#C21E2B;border:1px solid #C21E2B;">Quitar foto</button>
<button onclick="enviar()">Marcar ronda</button>
<div id="msg"></div>
<div id="pendientes"></div>

<div class="footer">Otra solución de <strong>DOMO SMART SPA</strong><br>Desarrollando la tecnología que protege a las empresas de hoy y de mañana.</div>

<script>
/* =================== CONFIGURACIÓN =================== */
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbyZgC_KxbaVtpckCXzyXZQtfk5wSnRGb-ZZPHElr4HL_WmMZTvEO6sKVrVyAQGQsCdbAg/exec";
/* ======================================================= */

var params = new URLSearchParams(window.location.search);
var idPunto = params.get('id') || '';
var token = params.get('t') || '';

document.getElementById('subtitulo').textContent = idPunto ? ("Punto: " + idPunto) : "Código QR sin identificar";

var codigoGuardado = localStorage.getItem('cr_codigo');
if (codigoGuardado) document.getElementById('codigo').value = codigoGuardado;

var geoPromise = new Promise(function (resolve) {
  if (!navigator.geolocation) { resolve({ lat: '', lon: '' }); return; }
  navigator.geolocation.getCurrentPosition(
    function (p) { resolve({ lat: p.coords.latitude, lon: p.coords.longitude }); },
    function () { resolve({ lat: '', lon: '' }); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

// Reduce la foto (tamaño y calidad) antes de enviarla, para que suba rápido
// incluso con datos móviles o WiFi lenta. De varios MB pasa a unos cientos de KB.
function comprimirImagen(file, maxDim, calidad) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', calidad));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo procesar la imagen')); };
    img.src = url;
  });
}

function quitarFoto() { document.getElementById('foto').value = ''; }

function colaPendientes() { return JSON.parse(localStorage.getItem('cr_pendientes') || '[]'); }
function guardarCola(cola) { localStorage.setItem('cr_pendientes', JSON.stringify(cola)); mostrarPendientes(); }
function mostrarPendientes() {
  var cola = colaPendientes();
  document.getElementById('pendientes').textContent = cola.length
    ? (cola.length + " ronda(s) esperando señal para sincronizarse.")
    : "";
}

function enviarAlBackend(payload) {
  return fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(function (r) { return r.json(); });
}

function enviar() {
  var codigo = document.getElementById('codigo').value;
  localStorage.setItem('cr_codigo', codigo);
  var fotoInput = document.getElementById('foto').files[0];
  var msg = document.getElementById('msg');
  msg.style.color = '#1A1A1A';
  msg.textContent = 'Obteniendo ubicación...';

  geoPromise.then(function (coords) {
    msg.textContent = fotoInput ? 'Comprimiendo foto...' : 'Enviando...';
    return (fotoInput ? comprimirImagen(fotoInput, 1200, 0.65) : Promise.resolve('')).then(function (b64) {
      msg.textContent = 'Enviando...';
      var payload = { id: idPunto, t: token, codigo: codigo, lat: coords.lat, lon: coords.lon, foto: b64 };
      return enviarAlBackend(payload).then(function (d) {
        msg.style.color = d.ok ? '#1a7d3c' : '#C21E2B';
        msg.textContent = d.mensaje;
      }).catch(function () {
        var cola = colaPendientes();
        cola.push(payload);
        guardarCola(cola);
        msg.style.color = '#C21E2B';
        msg.textContent = 'Sin señal — guardado en el celular, se enviará automáticamente.';
      });
    });
  });
}

function sincronizarPendientes() {
  var cola = colaPendientes();
  if (cola.length === 0) return;
  var restante = [];
  var procesos = cola.map(function (payload) {
    return enviarAlBackend(payload).catch(function () { restante.push(payload); });
  });
  Promise.all(procesos).then(function () { guardarCola(restante); });
}

window.addEventListener('online', sincronizarPendientes);
window.addEventListener('load', function () { mostrarPendientes(); sincronizarPendientes(); });
</script>
</body>
</html>
